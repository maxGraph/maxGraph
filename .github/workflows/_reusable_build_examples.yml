name: Build examples
on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the output artifact containing the built examples'
        required: true
        type: string
      runner:
        description: 'The runner to use for the build'
        required: false
        type: string
        default: 'ubuntu-24.04'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Setup
        uses: ./.github/actions/build-setup

      - name: Build @maxgraph/core
        shell: bash
        run: npm run build -w packages/core

      - name: Build all examples
        shell: bash
        run: ./scripts/build-all-examples.bash --fail-at-end

      # Runs even when the build step failed, so that the examples that did build can still be inspected. This is the
      # point of '--fail-at-end': get the whole picture from a single run. A failed build job still blocks the jobs
      # that depend on it, the release included.
      - name: Upload all examples as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs['artifact-name'] }}
          path: |
            packages/js-example*/dist/
            packages/ts-example*/dist/
